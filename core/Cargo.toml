[package]
name = "cadence-core"
version = "0.1.0"
edition = "2021"
description = "Native core for Cadence: Pomodoro engine and Brave/YouTube bridge"
publish = false

[lib]
name = "cadence_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
