name: Release

# Publishes a GitHub release for a version tag. Installed copies of Cadence pick
# it up through the in-app updater (App/Sources/Updater.swift), which installs
# the .zip asset of the latest release. Create the tag with scripts/release.sh.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v1.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The app's version comes from project.yml; a tag that disagrees would ship
      # an app the updater can never reach (it compares versions).
      - id: meta
        name: Resolve version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          app_version="$(sed -nE 's/.*MARKETING_VERSION: "([^"]*)".*/\1/p' project.yml)"
          if [ "$version" != "$app_version" ]; then
            echo "::error::Tag $TAG does not match MARKETING_VERSION $app_version in project.yml"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Rust core tests
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Test
        working-directory: core
        run: cargo test --locked

  build:
    name: Desktop macOS arm64
    needs: [preflight, test]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      # project.yml stays ad-hoc for local/CI builds; releases get Developer ID +
      # hardened runtime so Gatekeeper accepts them after notarization.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Cadence.xcodeproj -scheme Cadence -configuration Release \
            -derivedDataPath build-release \
            DEVELOPMENT_TEAM=T7A3N2UXYN \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            build | tail -n 40

      - name: Verify, notarize and package
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          app=build-release/Build/Products/Release/Cadence.app
          built="$(defaults read "$PWD/$app/Contents/Info.plist" CFBundleShortVersionString)"
          test "$built" = "$VERSION" || { echo "::error::Built $built, expected $VERSION"; exit 1; }
          codesign --verify --deep --strict "$app"
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY" | base64 --decode > "$key"
          ditto -c -k --norsrc --keepParent "$app" notarize.zip
          notary=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          out="$(xcrun notarytool submit notarize.zip "${notary[@]}" --wait --timeout 60m --output-format json)"
          echo "$out"
          id="$(echo "$out" | plutil -extract id raw -o - -)"
          if [ "$(echo "$out" | plutil -extract status raw -o - -)" != "Accepted" ]; then
            xcrun notarytool log "$id" "${notary[@]}"
            echo "::error::Notarization was not accepted"; exit 1
          fi
          rm "$key" notarize.zip
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose "$app"
          ditto -c -k --norsrc --keepParent "$app" "Cadence-$VERSION.zip"

      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-app
          path: Cadence-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-app

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Cadence-$VERSION.zip" --clobber
          else
            gh release create "$TAG" "Cadence-$VERSION.zip" --title "Cadence $VERSION" --generate-notes --verify-tag
          fi
