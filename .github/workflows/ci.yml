name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Rust core is plain Rust, so its tests run on Linux (cheaper than macOS minutes).
  core:
    name: Rust core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Test
        working-directory: core
        run: cargo test --locked

  # Builds the real app the way users get it. The Xcode pre-build phase compiles
  # the Rust core, so this also proves the static library links.
  macos:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Cadence.xcodeproj -scheme Cadence -configuration Release \
            -derivedDataPath build-release build | tail -n 40

      - name: Package
        run: |
          ditto -c -k --norsrc --keepParent build-release/Build/Products/Release/Cadence.app \
            "Cadence-${GITHUB_SHA::7}.zip"

      # Any commit's app can be downloaded from the run page for testing.
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-${{ github.sha }}
          path: Cadence-*.zip
          if-no-files-found: error
          retention-days: 7

  # Single required status: passes only when every job above passed.
  check:
    name: Check
    if: ${{ always() }}
    needs: [core, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        run: |
          test "${{ needs.core.result }}" = success
          test "${{ needs.macos.result }}" = success
